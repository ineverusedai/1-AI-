<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미션 1 · 글자 캡차</title>
<link rel="stylesheet" href="../style.css">
<style>
  #img { display: block; width: 840px; max-width: 86vw; border-radius: 12px; background: #fff; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  #answer {
    width: 520px; max-width: 70vw; font-family: var(--mono); font-size: 56px; font-weight: 700;
    letter-spacing: 10px; text-align: center; padding: 14px 18px; border-radius: 14px;
    border: 3px solid var(--line); background: #0b0d11; color: var(--text); outline: none;
    font-variant-numeric: slashed-zero; font-feature-settings: "zero" 1; -webkit-appearance: none;
  }
  #answer:focus { border-color: var(--accent); }
  .inputrow { display: flex; gap: 16px; align-items: center; }
  .records { margin-top: 26px; font-size: 16px; color: var(--muted); }
  @media (max-width: 760px) {
    .hud { grid-template-columns: 1fr auto; padding: 14px 16px; gap: 8px; }
    .hud .mission { display: none; }
    .timer { font-size: 56px; justify-self: start; }
    .progress .count { font-size: 44px; }
    .dots i { width: 14px; height: 14px; }
    main { padding: 12px 16px 30px; }
    .card { padding: 10px; width: 100%; }
    #img { width: 100%; max-width: 100%; }
    .inputrow { width: 100%; gap: 10px; }
    #answer { flex: 1; min-width: 0; width: auto; max-width: none; font-size: 34px; letter-spacing: 4px; }
    button { padding: 14px 22px; font-size: 22px; white-space: nowrap; }
    .overlay h1 { font-size: 40px; }
    .overlay .stats { gap: 18px; }
    .overlay .stats strong { font-size: 32px; }
  }
</style>
</head>
<body>
<header class="hud">
  <div class="mission">MISSION 1 · 글자 캡차<small id="ruleLine">60초 안에 10문제 연속 정답</small></div>
  <div class="timer" id="timer">60.0</div>
  <div class="progress">
    <div class="label">연속 정답</div>
    <div class="count"><b id="streak">0</b><span> / <span id="target">10</span></span></div>
    <div class="dots" id="dots"></div>
  </div>
</header>
<div class="sub">도전 <b id="attemptNo">-</b> · 문제 <b id="qNo">-</b> · 맞힘 <b id="correct">0</b> / <b id="answered">0</b></div>

<main>
  <div class="card" id="card"><img id="img" alt="캡차 이미지" draggable="false"></div>
  <div class="feedback" id="feedback"></div>
  <div class="inputrow">
    <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="12" disabled>
    <button id="submit" disabled>확인</button>
  </div>
  <div class="hint">대문자와 숫자만 나옵니다 · 소문자로 입력해도 됩니다<br>
    가끔 헷갈리는 글자가 하나씩 섞여요: <code>0</code> 숫자 영 &nbsp; <code>O</code> 대문자 오 &nbsp; <code>1</code> 숫자 일 &nbsp; <code>I</code> 대문자 아이</div>
</main>

<div class="overlay" id="startScreen">
  <div class="box">
    <h1>MISSION 1<br>글자 캡차</h1>
    <p id="startRule"></p>
    <p>틀리면 연속 카운트가 <b>0</b>으로 돌아갑니다. 시간은 계속 흐릅니다.</p>
    <p id="startFrom"></p>
    <div class="row" style="margin-top:34px">
      <button id="startBtn">시작 <kbd style="color:#fff;border-color:#fff8">Enter</kbd></button>
    </div>
    <div class="row"><button class="ghost" id="resetBtn">처음 문제(#1)부터</button><a class="ghost" href="../index.html" style="color:var(--muted);font-size:18px">미션 목록</a></div>
    <div class="records row"><span id="recCount"></span><button class="ghost dl">기록 CSV 받기</button><button class="ghost clr">기록 지우기</button></div>
  </div>
</div>

<div class="overlay" id="resultScreen" hidden>
  <div class="box">
    <h1 id="resultTitle"></h1>
    <p id="resultSub"></p>
    <div class="stats">
      <div><strong id="rTime">-</strong>걸린 시간</div>
      <div><strong id="rCorrect">-</strong>맞힘 / 푼 문제</div>
      <div><strong id="rStreak">-</strong>최고 연속</div>
    </div>
    <div class="row"><button id="retryBtn">다시 도전 <kbd style="color:#fff;border-color:#fff8">Enter</kbd></button></div>
    <div class="row"><a class="ghost" href="../index.html" style="color:var(--muted);font-size:18px">미션 목록</a></div>
    <div class="records row"><button class="ghost dl">기록 CSV 받기</button></div>
  </div>
</div>

<script src="../hmac.js"></script>
<script src="../records.js"></script>
<script src="data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const D = window.M1_DATA, R = HV.records, MISSION = "m1";
const limitMs = D.time_limit_sec * 1000, target = D.streak_target;
const state = R.state(MISSION);
let a = null, ticking = null, running = false;

function setDots(n) {
  const d = $("dots");
  if (d.children.length !== target) d.innerHTML = "<i></i>".repeat(target);
  Array.prototype.forEach.call(d.children, (el, i) => el.classList.toggle("on", i < n));
  $("streak").textContent = n;
}
function showTimer(ms) {
  const left = Math.max(0, limitMs - ms), el = $("timer");
  el.textContent = (left / 1000).toFixed(1);
  el.classList.toggle("low", left <= 20000 && left > 10000);
  el.classList.toggle("crit", left <= 10000);
}
function refreshStartInfo(resetHud) {
  $("target").textContent = target;
  $("ruleLine").textContent = `${D.time_limit_sec}초 안에 ${target}문제 연속 정답`;
  $("startRule").innerHTML = `<b>${D.time_limit_sec}초</b> 안에 <b>${target}문제 연속</b>으로 맞히면 인증 성공`;
  $("startFrom").textContent = `도전 #${state.attempt + 1} · 문제 #${state.next_q}부터 출제`;
  const c = R.counts();
  $("recCount").textContent = `이 브라우저에 저장된 기록: 답 ${c.answers}개 · 도전 ${c.summary}회`;
  if (resetHud) { setDots(0); showTimer(0); }
}
function setQuestion(qNo) {
  $("img").src = "images/" + D.questions[qNo - 1].file;
  $("qNo").textContent = "#" + qNo;
  const next = D.questions[qNo];  // 다음 이미지 미리 불러오기
  if (next) new Image().src = "images/" + next.file;
}

function start() {
  if (running) return;
  if (state.next_q > D.questions.length) { alert("문제를 모두 사용했습니다. '처음 문제(#1)부터'를 누르세요."); return; }
  state.attempt += 1; R.saveState();
  a = { attempt: state.attempt, q: state.next_q, streak: 0, maxStreak: 0, answered: 0, correct: 0,
        first10: [], t0: performance.now(), tLast: performance.now(), done: false };
  $("attemptNo").textContent = "#" + a.attempt;
  $("correct").textContent = 0; $("answered").textContent = 0;
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  setDots(0); setQuestion(a.q);
  $("startScreen").hidden = true; $("resultScreen").hidden = true;
  $("answer").disabled = false; $("submit").disabled = false;
  $("answer").value = ""; $("answer").focus();
  running = true;
  clearInterval(ticking);
  ticking = setInterval(() => {
    const ms = performance.now() - a.t0;
    showTimer(ms);
    if (ms >= limitMs && running) finish(false, limitMs, "timeout");
  }, 50);
}

function flash(ok) {
  const card = $("card"), fb = $("feedback");
  card.classList.remove("flash-ok", "flash-bad"); void card.offsetWidth;
  card.classList.add(ok ? "flash-ok" : "flash-bad");
  fb.className = "feedback " + (ok ? "ok" : "bad");
  fb.textContent = ok ? "정답!" : "틀림! 연속 0으로";
  setTimeout(() => card.classList.remove("flash-ok", "flash-bad"), 350);
}

function submit() {
  if (!running) return;
  const val = $("answer").value.trim();
  if (!val) return;
  const now = performance.now();
  const totalMs = Math.round(now - a.t0);
  if (totalMs > limitMs) { finish(false, limitMs, "timeout"); return; }
  const qNo = a.q;
  const ok = HV.answerHash(D.key, MISSION, qNo, val.toUpperCase()) === D.questions[qNo - 1].hash;
  const qMs = Math.round(now - a.tLast);
  a.tLast = now; a.answered += 1; a.correct += ok ? 1 : 0;
  a.streak = ok ? a.streak + 1 : 0; a.maxStreak = Math.max(a.maxStreak, a.streak);
  if (a.first10.length < 10) a.first10.push([ok ? 1 : 0, totalMs]);
  R.logAnswer({ who: "human", mission: MISSION, mode: "human", attempt: a.attempt, q_no: qNo,
                submitted: val, correct: ok ? 1 : 0, question_ms: qMs, total_ms: totalMs });
  state.next_q = qNo + 1; R.saveState();
  a.q = qNo + 1;
  flash(ok);
  $("answer").value = "";
  setDots(a.streak);
  $("correct").textContent = a.correct; $("answered").textContent = a.answered;
  if (a.streak >= target) return finish(true, totalMs, "success");
  if (a.q > D.questions.length) return finish(false, totalMs, "out_of_questions");
  setQuestion(a.q);
}

function finish(success, totalMs, reason) {
  if (!running) return;
  running = false; clearInterval(ticking);
  const f10 = a.first10;
  R.logSummary({ who: "human", mission: MISSION, mode: "human", attempt: a.attempt,
    success: success ? 1 : 0, answered: a.answered, correct: a.correct, max_streak: a.maxStreak,
    total_ms: totalMs, first10_correct: f10.length === 10 ? f10.reduce((s, x) => s + x[0], 0) : "",
    first10_ms: f10.length === 10 ? f10[9][1] : "", correct_in_limit: a.correct,
    note: success ? "성공" : reason === "timeout" ? "시간 초과" : "문제 소진" });
  $("answer").disabled = true; $("submit").disabled = true;
  showTimer(success ? totalMs : limitMs);
  $("resultTitle").textContent = success ? "인간 인증 성공 ✅" : "인증 실패 ❌";
  $("resultTitle").className = success ? "ok" : "bad";
  $("resultSub").textContent = success ? `${target}문제 연속 정답!` : reason === "timeout" ? "시간 초과" : "문제를 모두 사용했습니다";
  $("rTime").textContent = (totalMs / 1000).toFixed(1) + "초";
  $("rCorrect").textContent = `${a.correct} / ${a.answered}`;
  $("rStreak").textContent = a.maxStreak;
  setTimeout(() => { $("resultScreen").hidden = false; $("retryBtn").focus(); }, success ? 400 : 200);
  refreshStartInfo(false);
}

$("startBtn").onclick = start;
$("retryBtn").onclick = start;
$("submit").onclick = submit;
$("resetBtn").onclick = () => { state.next_q = 1; R.saveState(); refreshStartInfo(true); };
document.querySelectorAll(".dl").forEach(b => b.onclick = () => R.downloadAll());
document.querySelectorAll(".clr").forEach(b => b.onclick = () => {
  if (confirm("이 브라우저에 저장된 기록을 모두 지울까요? 먼저 CSV를 받아 두세요.")) {
    R.clearAll(); location.reload();
  }
});
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !running && document.activeElement !== $("answer")) { e.preventDefault(); start(); }
});
refreshStartInfo(true);
</script>
</body>
</html>

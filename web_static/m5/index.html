<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0f">
<title>미션 5 · ARC-AGI-3</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="vignette" id="vignette"></div>
<div class="fx" id="fx"></div>

<main class="stage m5">
  <section class="card arcboard">
    <div class="arcwrap">
      <canvas id="arc" width="64" height="64"></canvas>
      <div class="arcover" id="arcOver" hidden></div>
    </div>
    <aside class="arcside">
      <div>
        <div class="label">남은 시간</div>
        <div class="timer small" id="timer">30:00</div>
      </div>
      <div>
        <div class="label">깬 단계</div>
        <div class="streak small"><b id="lvNum">0</b><span>/<span id="lvTotal">0</span></span></div>
      </div>
      <div class="gtabs" id="gtabs"></div>
      <div class="keys" id="keys"></div>
    </aside>
  </section>
</main>

<div class="screen enter" id="startScreen">
  <div class="inner">
    <div><span class="chip">MISSION 5</span></div>
    <h1 class="head" id="startHead"><em>30분</em> 안에<br>처음 보는 게임 3개를 깨세요</h1>
    <button class="btn wide" id="startBtn" disabled>불러오는 중…</button>
  </div>
</div>

<div class="screen" id="resultScreen" hidden>
  <div class="inner result">
    <svg class="result-icon" id="resultIcon" viewBox="0 0 180 180"></svg>
    <h1 class="head" id="resultTitle"></h1>
    <div class="stats">
      <div><span>걸린 시간</span><strong id="rTime">-</strong></div>
      <div><span>깬 단계</span><strong id="rLevels">-</strong></div>
    </div>
    <button class="btn wide" id="retryBtn">다시 도전하기</button>
  </div>
</div>

<div class="note" id="note"></div>

<script src="../hmac.js"></script>
<script src="../records.js"></script>
<script src="pyodide/pyodide.js"></script>
<script src="m5.js"></script>
</body>
</html>

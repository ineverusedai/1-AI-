<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0f">
<title>미션 3 · 소리 착시 캡차</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="vignette" id="vignette"></div>
<div class="fx" id="fx"></div>

<main class="stage m3">
  <section class="card">
    <div class="status">
      <div>
        <div class="label">고르는 시간</div>
        <div class="timer" id="timer">0.0<small>초</small></div>
      </div>
      <div class="streakbox">
        <div class="label">정답</div>
        <div class="streak"><b id="streakNum">0</b><span>/<span id="target">5</span></span></div>
      </div>
    </div>
        <div class="segs" id="segs"></div>
  </section>

  <section class="card qcard m3" id="qcard">
    <button class="refbtn" id="refBtn" disabled><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><span class="t">원본 소리</span><span class="bars"><i></i><i></i><i></i><i></i></span></button>
    <div class="choices m3" id="choices"></div>
    <button class="btn wide" id="submit" disabled>확인</button>
  </section>
</main>

<div class="screen enter" id="startScreen">
  <div class="inner">
    <div><span class="chip">MISSION 3</span></div>
    <h1 class="head" id="startHead"></h1>
    <button class="btn wide" id="startBtn">시작하기</button>
  </div>
</div>

<div class="screen" id="resultScreen" hidden>
  <div class="inner result">
    <svg class="result-icon" id="resultIcon" viewBox="0 0 180 180"></svg>
    <h1 class="head" id="resultTitle"></h1>
    <div class="stats">
      <div><span>고르는 시간</span><strong id="rTime">-</strong></div>
      <div><span>최고 연속</span><strong id="rStreak">-</strong></div>
    </div>
    <button class="btn wide" id="retryBtn">다시 도전하기</button>
  </div>
</div>

<div class="note" id="note"></div>

<script src="../hmac.js"></script>
<script src="../records.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="engine.js"></script>
</body>
</html>

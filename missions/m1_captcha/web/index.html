<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0f">
<title>미션 1 · 글자 캡차</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="vignette" id="vignette"></div>

<main class="stage">
  <section class="card">
    <div class="status">
      <div>
        <div class="label">남은 시간</div>
        <div class="timer" id="timer">60.0<small>초</small></div>
      </div>
      <div class="streakbox">
        <div class="label">연속 정답</div>
        <div class="streak"><b id="streakNum">0</b><span>/<span id="target">10</span></span></div>
      </div>
    </div>
    <div class="timebar" id="timebar"><i id="timefill"></i></div>
    <div class="segs" id="segs"></div>
    <div class="fx" id="fx"></div>
  </section>

  <section class="card qcard" id="qcard">
    <img class="qimg" id="img" alt="" draggable="false">
    <div class="inputrow">
      <div class="fieldwrap">
        <input class="field" id="answer" placeholder=" " autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="12" disabled>
        <span class="ph">보이는 글자를 입력하세요</span>
      </div>
      <button class="btn" id="submit" disabled>확인</button>
    </div>
  </section>
</main>

<div class="screen enter" id="startScreen">
  <div class="inner">
    <div><span class="chip">MISSION 1</span></div>
    <h1 class="head" id="startHead"></h1>
    <button class="btn wide" id="startBtn">시작하기</button>
  </div>
</div>

<div class="screen" id="resultScreen" hidden>
  <div class="inner result">
    <svg class="result-icon" id="resultIcon" viewBox="0 0 180 180"></svg>
    <h1 class="head" id="resultTitle"></h1>
    <div class="stats">
      <div><span>걸린 시간</span><strong id="rTime">-</strong></div>
      <div><span>최고 연속</span><strong id="rStreak">-</strong></div>
    </div>
    <button class="btn wide" id="retryBtn">다시 도전하기</button>
  </div>
</div>

<div class="note" id="note"></div>

<script src="/m1/ui.js"></script>
<script src="/m1/engine.js"></script>
</body>
</html>
